<header class="header">

  <div class="left-section">

    <button class="menu-btn" (click)="toggleSidebar()">
      ☰
    </button>

    <h2>SmartPOS360</h2>

  </div>

  <div class="right-section">

    <input
      type="text"
      placeholder="Search..."
    />

    <button>🔔</button>

    <div class="language-selector">

  <span>🌐</span>

  <select (change)="changeLanguage($event)">

    <option value="en">
      English
    </option>

    <option value="es">
      Spanish
    </option>

    <option value="fr">
      French
    </option>

  </select>

</div>

    <button (click)="toggleTheme()">🌙</button>

    <div class="profile">

      <span>Admin</span>

      <button (click) = "logout()">Logout</button>

    </div>

  </div>

</header>
