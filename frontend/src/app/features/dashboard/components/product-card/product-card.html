<div class="card">

  <img
    [src]="product.image"
    [alt]="product.title"
    class="product-image"
  />

  <h3>{{ product.title }}</h3>

  <p class="category">
    {{ product.category }}
  </p>

  <p class="description">
    {{ product.description }}
  </p>

  <p class="price">
    ₹ {{ product.price }}
  </p>

  <p class="rating">
    ⭐ {{ product.rating.rate }}
    ({{ product.rating.count }} reviews)
  </p>
 <ng-content></ng-content>
  <button (click)="onDelete()">
    Delete
  </button>

   <button (click)="loadChild()">
    Load Dynamic Child
  </button>

  <!-- 👇 Dynamic component will appear here -->
  <ng-container #dynamicHost></ng-container>


</div>
