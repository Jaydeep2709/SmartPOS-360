
<div class="header-bar">
<h2>Products</h2>

<select [(ngModel)]="selectedCategory">

  <option value="ALL">
    All
  </option>

  <option value="men's clothing">
    Men's Clothing
  </option>

  <option value="women's clothing">
    Women's Clothing
  </option>

  <option value="electronics">
    Electronics
  </option>

  <option value="jewelery">
    Jewelery
  </option>

</select>

</div>
<div *ngIf="(products$ | async)?.length > 0;">
   <!-- (delete)="deleteProduct($event)" --> 
    <div class="product-grid"> 
      <!-- | stockFilter : selectedStockFilter --> 
       <app-product-card 
          *ngFor="let product of (products$ | async) | stockFilter : selectedCategory" 
          [product]="product"
        > 
          <span class="badge">🔥 Featured</span>
       </app-product-card> 
      </div>

<div *ngIf="(products$ | async)?.length > 0;
    else noProducts">
 <!-- (delete)="deleteProduct($event)" -->
  <div class="product-grid">
<!-- | stockFilter : selectedStockFilter -->

    <app-product-card
      *ngFor="let product of products | stockFilter : selectedCategory"
    [product]="product"
   >
    </app-product-card>
    </div>
     <div class="product-grid">
<table mat-table [dataSource]="(products$ | async) | stockFilter : selectedCategory">

  <!-- ID -->
  <ng-container matColumnDef="id">

    <th mat-header-cell *matHeaderCellDef>
      ID
    </th>

    <td mat-cell *matCellDef="let p">
      {{ p.id }}
    </td>

  </ng-container>

  <!-- IMAGE -->
  <ng-container matColumnDef="image">

    <th mat-header-cell *matHeaderCellDef>
      Image
    </th>

    <td mat-cell *matCellDef="let p">

      <img
        [src]="p.image"
        width="50"
      />

    </td>

  </ng-container>

  <!-- TITLE -->
  <ng-container matColumnDef="title">

    <th mat-header-cell *matHeaderCellDef>
      Title
    </th>

    <td mat-cell *matCellDef="let p">
      {{ p.title }}
    </td>

  </ng-container>

  <!-- CATEGORY -->
  <ng-container matColumnDef="category">

    <th mat-header-cell *matHeaderCellDef>
      Category
    </th>

    <td mat-cell *matCellDef="let p">
      {{ p.category }}
    </td>

  </ng-container>

  <!-- PRICE -->
  <ng-container matColumnDef="price">

    <th mat-header-cell *matHeaderCellDef>
      Price
    </th>

    <td mat-cell *matCellDef="let p">
      ₹ {{ p.price }}
    </td>

  </ng-container>

  <!-- RATING -->
  <ng-container matColumnDef="rating">

    <th mat-header-cell *matHeaderCellDef>
      Rating
    </th>

    <td mat-cell *matCellDef="let p">

      ⭐ {{ p.rating.rate }}

    </td>

  </ng-container>

  <!-- ACTIONS -->
  <ng-container matColumnDef="actions">

    <th mat-header-cell *matHeaderCellDef>
      Actions
    </th>

    <td mat-cell *matCellDef="let p">

      <button
        mat-button
        color="warn"
      >
        Delete
      </button>

    </td>

  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;">
  </tr>

</table>
  </div>

</div>
<ng-template #noProducts>

  <p>No products available</p>

</ng-template>
